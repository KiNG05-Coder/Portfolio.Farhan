# Deploys the site to GitHub Pages on every push to `main`.
#
# One-time setup on GitHub:
#   Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions
#
# If this is a PROJECT repo (URL like username.github.io/repo-name), also
# uncomment `base:` in astro.config.mjs and set it to '/repo-name'.
# Not needed for a username.github.io repo or a custom domain.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
